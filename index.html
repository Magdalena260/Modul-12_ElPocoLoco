<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>El Pollo Loco</title>

    <link rel="icon" href="img/favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Rubik+Gemstones&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="models/audiohub.class.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>

    <script src="models/background-object.class.js"></script>
    <script src="models/cloud.class.js"></script>

    <script src="models/chicken.class.js"></script>
    <script src="models/smallchicken.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/character.class.js"></script>

    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>

    <script src="models/throwable-object.class.js"></script>

    <script src="models/status-bar.class.js"></script>

    <script src="models/world.class.js"></script>

    <script src="levels/level1.js"></script>

    <script src="js/game.js"></script>
</head>

<body onload="init()">

    <div id="rotateScreen">
        Please turn the device around
    </div>

    <button id="muteBtn" onclick="toggleMute()">🔊 Sound</button>

    <div id="uiFrame">

        <div id="gameContainer">

            <div id="startScreen">
                <h1>El Pollo Loco</h1>

                <button onclick="startGame()">Start Game</button>
                <button onclick="showHowToPlay()">How to Play</button>
            </div>

            <div id="howToPlayOverlay" style="display:none;">
                <img src="img/howtoplay.png" alt="How to Play">
                <button class="gameButton" onclick="closeHowToPlay()">Back</button>
            </div>

            <canvas id="canvas" width="720" height="480"></canvas>

            <div id="mobileControls">

                <button class="mobileBtn"
                    ontouchstart="keyboard.LEFT = true"
                    ontouchend="keyboard.LEFT = false">⬅</button>

                <button class="mobileBtn"
                    ontouchstart="keyboard.RIGHT = true"
                    ontouchend="keyboard.RIGHT = false">➡</button>

                <!-- FIXED JUMP BUTTON -->
                <button class="mobileBtn"
                    ontouchstart="keyboard.UP = true"
                    ontouchend="keyboard.UP = false">⬆</button>

                <button class="mobileBtn"
                    ontouchstart="keyboard.D = true"
                    ontouchend="keyboard.D = false">D</button>

            </div>

            <div id="gameOverScreen" class="overlay" style="display:none;">
                <h1>You Lost!</h1>
                <button onclick="restartGame()">Restart</button>
            </div>

            <div id="winScreen" class="overlay" style="display:none;">
                <h1>You Win!</h1>
                <button onclick="restartGame()">Play Again</button>
            </div>

        </div>
    </div>

    <footer>
        <a href="impressum.html">Impressum</a>
    </footer>

</body>
</html>
