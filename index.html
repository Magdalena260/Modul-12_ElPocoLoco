<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Pollo Loco</title>
<!-- FAVICON -->
<link rel="icon" href="img/favicon.png">
<!-- Locale Einbindung  Schrift -->
<link href="https://fonts.googleapis.com/css2?family=Rubik+Gemstones&display=swap" rel="stylesheet">
<!-- Verknüpfung CSS -->
<link rel="stylesheet" href="style.css">


<!-- Verknüfpung AUDIODATEN -->
<script src="models/audiohub.class.js"></script>

<!-- Verknüfpung MUTE BUTTON mit Wechselmöglichkeit-->
<button id="muteBtn" onclick="toggleMute()">Sound on</button>
<!-- BASE -->
 <!-- Verknüfpung-->
<script src="models/drawable-object.class.js"></script>
<!-- Verknüfpung allgemeine Elemente für Objekte-->
<script src="models/movable-object.class.js"></script>
<!-- Verknüfpung Tastaturbefehle-->
<script src="models/keyboard.class.js"></script>
<!-- Verknüfpung Level-->
<script src="models/level.class.js"></script>

<!-- GAME OBJECTS -->
 <!-- Verknüfpung Hintergründe-->
<script src="models/background-object.class.js"></script>
<!-- Verknüfpung Wolken-->
<script src="models/cloud.class.js"></script>


<!-- Verknüfpung braune Hühnchen-->
<script src="models/chicken.class.js"></script>
<!-- Verknüfpung gelbe Küken-->
<script src="models/smallchicken.class.js"></script>
<!-- Verknüfpung Endboss-->
<script src="models/endboss.class.js"></script>
<!-- Verknüfpung Charakter Pepe-->
<script src="models/character.class.js"></script>

<!-- COLLECTIBLES -->
 
<!-- Verknüfpung Coins-->
<script src="models/coin.class.js"></script>
<!-- Verknüfpung Flaschen-->
<script src="models/bottle.class.js"></script>

<!-- THROWABLE -->
 <!-- Verknüfpung Flaschen werfen-->
<script src="models/throwable-object.class.js"></script>

<!-- UI -->
  <!-- Verknüfpung statusbars-->
<script src="models/status-bar.class.js"></script>

<!-- WORLD -->
   <!-- Verknüfpung ganze Welt (sehr wichtige Datei)-->
<script src="models/world.class.js"></script>

<!-- LEVEL -->
 <!-- Verknüfpung Level alle Objekte-->
<script src="levels/level1.js"></script>

<!-- GAME -->
  <!-- Verknüfpung Game (grundlegende Sachen festgelegt)-->
<script src="js/game.js"></script>

</head>
<!-- wird geladen -->
<body onload="init()">
<!-- Rahmen um Spielscreen (Canvas)-->
<div id="uiFrame">
  <!-- Rahmen Spielscreen (Canvas)-->
    <div id="gameContainer">

    <!-- Startscreen-->
    <div id="startScreen">
    <!-- Startscreen Überschrift-->
    <h1>El Pollo Loco</h1>
      <!-- Startscreen Buttons Start Game: Spiel startet-->
    <button onclick="startGame()">Start Game</button>
     <!-- Startscreen Buttons How to Play: Bild mit Erklärungen-->
    <button onclick="showHowToPlay()">How to Play</button>
</div>

<!-- HOW TO PLAY IMAGE -->
 <!-- Startscreen Buttons How to Play: Bild mit Erklärungen-->
<div id="howToPlayOverlay" style="display:none;">
    <img src="img/howtoplay.png" alt="How to Play">
  <button class="gameButton" onclick="closeHowToPlay()">Back</button>
</div>

        <!-- CANVAS -->
        <canvas id="canvas" width="720" height="480"></canvas>

        <!-- GAME OVER -->
        <div id="gameOverScreen" class="overlay" style="display:none;">
            <h1>You Lost!</h1>
            <button onclick="location.reload()">Restart</button>
        </div>

        <!-- WIN SCREEN -->
        <div id="winScreen" class="overlay" style="display:none;">
            <h1>You Win!</h1>
            <button onclick="location.reload()">Play Again</button>
        </div>

    </div>

</div>


<footer>
    <a href="impressum.html">Impressum</a>
</footer>
</body>
</html>
